<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='880' viewBox='0 0 1200 880'><style>.t{font-family:Arial,sans-serif;font-size:18px}.s{font-family:Arial,sans-serif;font-size:14px}.b{fill:#e8f1ff;stroke:#2f6fab;stroke-width:2}.o{fill:#e6f4ea;stroke:#2e7d32;stroke-width:2}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#333'/></marker></defs><text x='30' y='35' class='t'>UML Use Case: интеллектуальное ценообразование</text><rect x='90' y='80' width='850' height='55' rx='8' class='b'/><text x='110' y='114' class='s'>Актор: менеджер по ценообразованию</text><rect x='90' y='170' width='850' height='55' rx='8' class='b'/><text x='110' y='204' class='s'>UC1: загрузить продажи и каталог</text><line x1='515' y1='135' x2='515' y2='170' class='l'/><rect x='90' y='260' width='850' height='55' rx='8' class='b'/><text x='110' y='294' class='s'>UC2: получить рыночные цены</text><line x1='515' y1='225' x2='515' y2='260' class='l'/><rect x='90' y='350' width='850' height='55' rx='8' class='b'/><text x='110' y='384' class='s'>UC3: проверить качество данных</text><line x1='515' y1='315' x2='515' y2='350' class='l'/><rect x='90' y='440' width='850' height='55' rx='8' class='b'/><text x='110' y='474' class='s'>UC4: рассчитать рекомендованную цену</text><line x1='515' y1='405' x2='515' y2='440' class='l'/><rect x='90' y='530' width='850' height='55' rx='8' class='b'/><text x='110' y='564' class='s'>UC5: получить объяснение рекомендации</text><line x1='515' y1='495' x2='515' y2='530' class='l'/><rect x='90' y='620' width='850' height='55' rx='8' class='b'/><text x='110' y='654' class='s'>UC6: согласовать и опубликовать цену</text><line x1='515' y1='585' x2='515' y2='620' class='l'/><rect x='90' y='710' width='850' height='55' rx='8' class='o'/><text x='110' y='744' class='s'>UC7: сформировать отчёт и контролировать отклонения</text><line x1='515' y1=